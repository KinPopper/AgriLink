<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriLink - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <header style="padding: 15px 30px;">
        <!-- HEADER FLEX CONTAINER FOR LOGO & TITLE -->
        <div style="display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 5px;">
            <!-- IMG LOGO (Replace 'logo.png' with your actual image filename) -->
            <img src="AgriLink_Logo.png" alt="AgriLink Logo" style="height: 50px; width: 50px; object-fit: contain; border-radius: 50%; padding: 2px;">
            
            <h1 style="font-size: 37px;">AgriLink</h1>
        </div>
        <nav>
            <a href="index.html">Home</a> | 
            <a href="register.html">Register</a> | 
            <a href="login.html">Login</a>
        </nav>
    </header>

    <div class="container" style="max-width: 450px; margin-top: 40px; margin-bottom: 60px;">
        <h2 style="text-align: center; color: #2e7d32;">User Login</h2>

        <form id="loginForm">
            <div class="form-group">
                <label>Email / Username:</label>
                <input type="text" id="email" placeholder="e.g. farmer@agrilink.com or consumer1@agrilink.com" required>
            </div>

            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-submit" style="background-color: #2e7d32; color: white; width: 100%; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Login</button>
        </form>

        <p style="text-align: center; margin-top: 15px; font-size: 14px;">
            Don't have an account? <a href="register.html" style="color: #2e7d32; font-weight: bold;">Register here</a>
        </p>
    </div>

    <footer>
        <p>&copy; 2026 AgriLink - ICCT Colleges Web Project</p>
    </footer>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            var emailInput = document.getElementById("email").value.trim().toLowerCase();
            var passwordInput = document.getElementById("password").value.trim();

            // 1. Strict Admin Deactivation Check
            if (localStorage.getItem("deactivate_" + emailInput) === "true") {
                alert("❌ Login Blocked: Your account has been deactivated by the Admin.");
                return;
            }

            // 2. Default Predefined Account Catalog
            var defaultAccounts = {
                "admin": { password: "admin", name: "System Administrator", role: "admin", page: "admin.html" },
                "farmer@agrilink.com": { password: "123456", name: "Juan Dela Cruz", farm: "Dela Cruz Organic Farms", role: "producer", page: "producer.html" },
                "farmer2@agrilink.com": { password: "123456", name: "Maria Santos", farm: "Green Valley Hydroponics", role: "producer", page: "producer.html" },
                "farmer3@agrilink.com": { password: "123456", name: "Pedro Penduko", farm: "Penduko Highland Crops", role: "producer", page: "producer.html" },
                "farmer4@agrilink.com": { password: "123456", name: "Ana Reyes", farm: "Reyes Integrated Farm", role: "producer", page: "producer.html" },
                "buyer@agrilink.com": { password: "123456", name: "Maria Santos", role: "consumer", page: "consumer.html" },
                "consumer1@agrilink.com": { password: "123456", name: "Carlos Gomez", role: "consumer", page: "consumer.html" },
                "consumer2@agrilink.com": { password: "123456", name: "Bea Alonzo", role: "consumer", page: "consumer.html" },
                "consumer3@agrilink.com": { password: "123456", name: "Jose Rizal", role: "consumer", page: "consumer.html" },
                "consumer4@agrilink.com": { password: "123456", name: "Corazon Aquino", role: "consumer", page: "consumer.html" },
                "consumer5@agrilink.com": { password: "123456", name: "Andres Bonifacio", role: "consumer", page: "consumer.html" }
            };

            // 3. First check predefined default accounts
            var user = defaultAccounts[emailInput];

            if (user) {
                if (user.password === passwordInput) {
                    localStorage.setItem("loggedInUser", user.name);
                    localStorage.setItem("loggedInEmail", emailInput);
                    localStorage.setItem("loggedInRole", user.role);
                    if (user.farm) {
                        localStorage.setItem("loggedInFarm", user.farm);
                    }
                    alert("🎉 Welcome back, " + user.name + "!");
                    window.location.href = user.page;
                    return;
                } else {
                    alert("❌ Invalid password! Please try again.");
                    return;
                }
            }

            // 4. Check dynamically registered accounts in localStorage
            var registeredUsers = JSON.parse(localStorage.getItem("agrilink_users") || "[]");
            var foundUser = registeredUsers.find(function(u) {
                return u.email.toLowerCase() === emailInput;
            });

            if (foundUser) {
                if (foundUser.password === passwordInput) {
                    localStorage.setItem("loggedInUser", foundUser.name);
                    localStorage.setItem("loggedInEmail", foundUser.email);
                    localStorage.setItem("loggedInRole", foundUser.role.toLowerCase());
                    if (foundUser.farm) {
                        localStorage.setItem("loggedInFarm", foundUser.farm);
                    }
                    
                    alert("🎉 Welcome back, " + foundUser.name + "!");

                    // Redirect based on registered role
                    if (foundUser.role.toLowerCase() === "producer") {
                        window.location.href = "producer.html";
                    } else if (foundUser.role.toLowerCase() === "admin") {
                        window.location.href = "admin.html";
                    } else {
                        window.location.href = "consumer.html";
                    }
                } else {
                    alert("❌ Invalid password! Please try again.");
                }
            } else {
                alert("❌ Account not found! Please register first.");
            }
        });
    </script>

</body>
</html>

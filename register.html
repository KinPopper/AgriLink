<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AgriLink - Register</title>
    <!-- to link the css file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <header style="padding: 15px 30px;">
        <!-- HEADER FLEX CONTAINER FOR LOGO & TITLE -->
        <div style="display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 5px;">
            <!-- IMG LOGO (Replace 'logo.png' with your actual image filename) -->
            <img src="AgriLink_Logo.png" alt="AgriLink Logo" style="height: 50px; width: 50px; object-fit: contain; border-radius: 50%; padding: 2px;">
            
            <h1 style="font-size: 37px;">AgriLink</h1>
        </div>
        <nav>
            <a href="index.html">Home</a> | 
            <a href="register.html">Register</a> | 
            <a href="login.html">Login</a>
        </nav>
    </header>

        <div>
            <h2 style="text-align: center; color: #2e7d32;">
                Create an AgriLink Account</h2>
        </div>

    <div class="container" style="max-width: 500px; margin-top: 30px; margin-bottom: 60px;">
        
        <!-- REGISTRATION FORM -->
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Register As:</label>
                <select id="roleSelect">
                    <option value="Producer">Producer (Farmer / Seller)</option>
                    <option value="Consumer">Consumer (Buyer)</option>
                </select>
            </div>

            <div class="form-group">
                <label>First Name:</label>
                <input type="text" id="firstName" placeholder="e.g. Juan" required>
            </div>
            
            <div class="form-group">
                <label>Last Name:</label>
                <input type="text" id="lastName" placeholder="e.g. Dela Cruz" required>
            </div>

            <div class="form-group">
                <label>Farm / Business Name (For Producers):</label>
                <input type="text" id="farmName" placeholder="e.g. Dela Cruz Organic Farms">
            </div>

            <div class="form-group">
                <label>Email Address:</label>
                <input type="email" id="emailInput" placeholder="juan@gmail.com" required>
            </div>

            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="passwordInput" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn-submit" style="background-color: #2e7d32; color: white; width: 100%; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Register Account</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 AgriLink - ICCT Colleges Web Project</p>
    </footer>

    <!-- JAVASCRIPT FOR SAVING TO LOCALSTORAGE -->
    <script>
        function handleRegister(event) {
            event.preventDefault(); // Stop page from reloading

            // 1. Get values from form inputs
            var role = document.getElementById("roleSelect").value;
            var firstName = document.getElementById("firstName").value.trim();
            var lastName = document.getElementById("lastName").value.trim();
            var fullName = firstName + " " + lastName;
            var farmName = document.getElementById("farmName").value.trim();
            var email = document.getElementById("emailInput").value.trim().toLowerCase();
            var password = document.getElementById("passwordInput").value;

            // If consumer, set default farm name text
            if (role === "Consumer") {
                farmName = "N/A (Consumer)";
            } else if (!farmName) {
                farmName = fullName + "'s Farm";
            }

            // 2. Get existing registered users from localStorage (or empty array)
            var users = JSON.parse(localStorage.getItem("agrilink_users") || "[]");

            // 3. Check if email is already registered
            var existingUser = users.find(function(u) { return u.email === email; });
            if (existingUser) {
                alert("❌ This email address is already registered! Please log in or use a different email.");
                return;
            }

            // 4. Push new user object into array
            users.push({
                role: role,
                name: fullName,
                farm: farmName,
                email: email,
                password: password
            });

            // 5. Save back to localStorage
            localStorage.setItem("agrilink_users", JSON.stringify(users));

            // Also seed default demo accounts if not already saved, so login works smoothly
            seedDefaultAccounts();

            alert("🎉 Registration Successful!\nWelcome to AgriLink, " + fullName + "!\nYou can now log in using your email and password.");
            
            // 6. Redirect to login page
            window.location.href = "login.html";
        }

        // Helper to ensure demo accounts are always present in localStorage
        function seedDefaultAccounts() {
            var defaultUsers = [
                { role: "Admin", name: "System Administrator", farm: "N/A (Platform Admin)", email: "admin", password: "admin" },
                { role: "Producer", name: "Juan Dela Cruz", farm: "Dela Cruz Organic Farms", email: "farmer@agrilink.com", password: "123456" },
                { role: "Producer", name: "Maria Santos", farm: "Green Valley Hydroponics", email: "farmer2@agrilink.com", password: "123456" },
                { role: "Consumer", name: "Carlos Gomez", farm: "N/A (Consumer)", email: "consumer1@agrilink.com", password: "123456" }
            ];

            var storedUsers = JSON.parse(localStorage.getItem("agrilink_users") || "[]");
            
            // If empty or doesn't have default accounts, merge them
            defaultUsers.forEach(function(defU) {
                var exists = storedUsers.some(function(u) { return u.email === defU.email; });
                if (!exists) {
                    storedUsers.push(defU);
                }
            });

            localStorage.setItem("agrilink_users", JSON.stringify(storedUsers));
        }

        // Run on page load to initialize default accounts storage
        window.onload = function() {
            seedDefaultAccounts();
        };
    </script>

</body>
</html>
